<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Reward</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --accent: #38bdf8;
            --error: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            width: 320px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Loading Dots Animation */
        .dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent);
            margin: 0 4px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dots span:nth-child(1) { animation-delay: -0.32s; }
        .dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Message Styling */
        #status-text {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .hidden {
            display: none;
        }

        .error-icon {
            color: var(--error);
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .btn {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="loading-area">
        <div id="status-text">Fetching Details</div>
        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div id="error-area" class="hidden">
        <div class="error-icon">✕</div>
        <h2 style="color: var(--error); margin: 0 0 10px 0;">Sorry!</h2>
        <p style="opacity: 0.8; line-height: 1.5;">This code has already been claimed by another user.</p>
        <button class="btn" onclick="location.reload()">Try Again</button>
    </div>
</div>

<script>
    // Simulate a network delay
    setTimeout(() => {
        document.getElementById('loading-area').classList.add('hidden');
        document.getElementById('error-area').classList.remove('hidden');
    }, 3500); // 3.5 seconds delay
</script>

</body>
</html>
