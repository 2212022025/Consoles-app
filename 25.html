<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consoles App Loader</title>
    <style>
        /* Modern UI Reset & Body Styling */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f13; /* Dark modern background */
            color: #ffffff;
            overflow: hidden; /* Prevent scrolling */
        }

        /* Loader Screen Container */
        #loader-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at center, #1e1e28 0%, #0f0f13 100%);
            position: absolute;
            width: 100%;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        /* Image Styling */
        .logo {
            max-width: 250px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            margin-bottom: 25px;
            animation: fadeInDown 1s ease;
        }

        /* Developer Text Styling */
        .dev-text {
            font-size: 1.4rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
            color: #4facfe; /* Cool blue accent */
            text-transform: uppercase;
            font-weight: 600;
            animation: fadeInUp 1s ease;
        }

        /* Play Button Styling */
        #play-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
            transition: all 0.3s ease;
            animation: fadeInUp 1.2s ease;
        }

        #play-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(79, 172, 254, 0.6);
        }

        #play-btn:active {
            transform: translateY(2px) scale(0.98);
        }

        /* SVG Icon inside button */
        #play-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        /* Iframe Container */
        #content-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #main-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* UI Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Loader UI -->
    <div id="loader-screen">
        <img src="https://files.catbox.moe/97wtzi.png" alt="App Logo" class="logo">
        <div class="dev-text">Developed By Utkarshx</div>
        
        <button id="play-btn">
            <!-- Play/Expand Icon SVG -->
            <svg viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
            Play Fullscreen
        </button>
    </div>

    <!-- Hidden Iframe UI -->
    <div id="content-screen">
        <!-- Allows fullscreen inside the iframe if the iframe content needs it -->
        <iframe id="main-iframe" src="https://2212022025.github.io/Consoles-app/online.html" allowfullscreen></iframe>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const playBtn = document.getElementById('play-btn');
        const loaderScreen = document.getElementById('loader-screen');
        const contentScreen = document.getElementById('content-screen');

        playBtn.addEventListener('click', () => {
            // 1. Request Fullscreen from the browser
            const elem = document.documentElement;
            
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }

            // 2. Fade out the loader
            loaderScreen.style.opacity = '0';
            
            // 3. Wait for the fade out to finish, then show the iframe
            setTimeout(() => {
                loaderScreen.style.display = 'none';
                contentScreen.style.display = 'block';
            }, 500); // 500ms matches the CSS transition time
        });
    </script>

</body>
</html>
