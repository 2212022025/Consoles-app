<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky Bound: Daylight</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@800&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
            font-family: 'Nunito', sans-serif;
            touch-action: none;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI LAYER --- */
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .score-display {
            position: absolute;
            top: 10%;
            font-family: 'Fredoka One', cursive;
            font-size: 6rem;
            color: white;
            -webkit-text-stroke: 3px #333;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.2);
            z-index: 20;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #messageBox {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 60px;
            border-radius: 40px;
            border: 4px solid #fff;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            pointer-events: auto;
            text-align: center;
            transform: scale(1);
            transition: opacity 0.3s, transform 0.3s;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #4facfe;
            margin: 0;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #def;
        }

        p {
            color: #666;
            font-size: 1.2rem;
            margin: 10px 0 30px 0;
            font-weight: 800;
        }

        /* --- THE ULTIMATE BUTTON --- */
        .btn {
            position: relative;
            padding: 20px 60px;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            border: none;
            border-radius: 60px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.8rem;
            color: white;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 
                0 8px 0 #2c8ad1, 
                0 15px 20px rgba(0,0,0,0.2);
            transition: all 0.1s;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 10px 0 #2c8ad1, 
                0 20px 30px rgba(0,0,0,0.3);
            background: linear-gradient(to bottom, #5cb8ff 0%, #33f5ff 100%);
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 
                0 2px 0 #2c8ad1, 
                0 5px 10px rgba(0,0,0,0.2);
        }

        /* Shine animation */
        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
            transform: skewX(-20deg);
            transition: 0.5s;
        }
        .btn:hover::after {
            left: 150%;
            transition: 0.7s;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8) !important;
        }

    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="uiLayer">
        <div class="score-display" id="scoreVal">0</div>
        
        <div id="messageBox">
            <h1 id="titleText">FLAPPY DAY</h1>
            <p id="subText">Dodge the industrial pillars!</p>
            <button class="btn" id="actionBtn">PLAY NOW</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Refs
    const scoreEl = document.getElementById('scoreVal');
    const msgBox = document.getElementById('messageBox');
    const titleText = document.getElementById('titleText');
    const subText = document.getElementById('subText');
    const actionBtn = document.getElementById('actionBtn');

    // --- Config & State ---
    let frames = 0;
    let score = 0;
    let isGameOver = false;
    let isPlaying = false;
    let gameSpeed = 3.5; 

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Procedural Generation Classes ---

    // 1. Mountains (Distant, Misty)
    const mountains = {
        points: [],
        init: function() {
            this.points = [];
            let y = canvas.height * 0.7;
            for(let x = 0; x <= canvas.width + 300; x+=150) {
                this.points.push({ x: x, y: y - Math.random() * 200 });
            }
        },
        update: function() {
            for(let i=0; i<this.points.length; i++) this.points[i].x -= 0.5; // Slow parallax
            if(this.points[0].x < -300) {
                this.points.shift();
                let lastX = this.points[this.points.length-1].x;
                this.points.push({ x: lastX + 150, y: (canvas.height * 0.7) - Math.random() * 200 });
            }
        },
        draw: function() {
            // Gradient fill for depth
            let grad = ctx.createLinearGradient(0, canvas.height/2, 0, canvas.height);
            grad.addColorStop(0, '#a1c4fd'); // Misty Blue
            grad.addColorStop(1, '#c2e9fb'); 

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(this.points[0].x, canvas.height);
            for(let i=0; i<this.points.length; i++) ctx.lineTo(this.points[i].x, this.points[i].y);
            ctx.lineTo(this.points[this.points.length-1].x, canvas.height);
            ctx.fill();
        }
    };

    // 2. Rolling Terrain (Foreground)
    const terrain = {
        points: [],
        speed: 3.5,
        init: function() {
            this.points = [];
            let y = canvas.height - 50;
            for(let x = 0; x <= canvas.width + 100; x+=50) {
                this.points.push({ x: x, y: y - Math.random() * 30 });
            }
        },
        update: function() {
            for(let i=0; i<this.points.length; i++) this.points[i].x -= this.speed;
            if(this.points[0].x < -100) {
                this.points.shift();
                let lastX = this.points[this.points.length-1].x;
                this.points.push({ x: lastX + 50, y: (canvas.height - 50) - Math.random() * 30 });
            }
        },
        draw: function() {
            ctx.beginPath();
            ctx.moveTo(this.points[0].x, canvas.height);
            for (let i = 0; i < this.points.length - 1; i++) {
                let p0 = this.points[i];
                let p1 = this.points[i+1];
                let mx = (p0.x + p1.x) / 2;
                let my = (p0.y + p1.y) / 2;
                ctx.quadraticCurveTo(p0.x, p0.y, mx, my);
            }
            ctx.lineTo(this.points[this.points.length-1].x, canvas.height);
            
            // Bright Green Grass
            let grad = ctx.createLinearGradient(0, canvas.height - 100, 0, canvas.height);
            grad.addColorStop(0, '#76b852'); 
            grad.addColorStop(1, '#8DC26F');
            ctx.fillStyle = grad;
            ctx.fill();

            // Top Border
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#5c9442'; // Darker green outline
            ctx.stroke();
            ctx.lineWidth = 1;
        }
    };

    // 3. Atmosphere (Daylight)
    const atmosphere = {
        draw: function() {
            // Bright Sky Gradient
            let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#4facfe'); // Vivid Blue
            grad.addColorStop(1, '#00f2fe'); // Cyan
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        },
        drawSun: function() {
            // Bright Sun with Bloom
            ctx.save();
            ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
            ctx.shadowBlur = 80;
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.arc(canvas.width - 100, 80, 50, 0, Math.PI * 2);
            ctx.fill();
            
            // Halo
            ctx.fillStyle = 'rgba(255, 255, 200, 0.3)';
            ctx.beginPath();
            ctx.arc(canvas.width - 100, 80, 80, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    };

    // 4. Clouds
    const clouds = [];
    class Cloud {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * (canvas.height / 2);
            this.size = 0.5 + Math.random(); 
            this.speed = 0.2 + Math.random() * 0.3;
        }
        update() {
            this.x -= this.speed;
            if(this.x < -200) this.x = canvas.width + 200;
        }
        draw() {
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.beginPath();
            ctx.arc(this.x, this.y, 30 * this.size, 0, Math.PI * 2);
            ctx.arc(this.x + 25*this.size, this.y - 10*this.size, 40*this.size, 0, Math.PI*2);
            ctx.arc(this.x + 60*this.size, this.y, 30*this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    for(let i=0; i<6; i++) clouds.push(new Cloud());

    // --- Game Entities ---

    const bird = {
        x: 80,
        y: 200,
        radius: 16,
        velocity: 0,
        gravity: 0.25,
        jump: 6.5,
        rotation: 0,
        
        draw: function() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Rotation
            let targetRotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
            this.rotation = targetRotation;
            ctx.rotate(this.rotation);

            // 1. Body (Spherical Shading)
            let bodyGrad = ctx.createRadialGradient(-5, -5, 2, 0, 0, 18);
            bodyGrad.addColorStop(0, '#ffd200'); // Highlight
            bodyGrad.addColorStop(1, '#f7971e'); // Shadow
            ctx.fillStyle = bodyGrad;
            
            ctx.beginPath();
            ctx.ellipse(0, 0, 20, 16, 0, 0, Math.PI*2); // Body shape
            ctx.fill();
            
            // 2. Eye (Blinking Logic)
            let eyeOpen = true;
            if (frames % 150 > 145) eyeOpen = false; // Blink every few seconds

            if (eyeOpen) {
                // Sclera
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(8, -6, 7, 0, Math.PI*2);
                ctx.fill();
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                ctx.stroke();

                // Pupil
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(10, -6, 3, 0, Math.PI*2);
                ctx.fill();
                // Glint
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(11, -7, 1, 0, Math.PI*2);
                ctx.fill();
            } else {
                // Closed eye line
                ctx.beginPath();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#333';
                ctx.moveTo(4, -6);
                ctx.lineTo(12, -6);
                ctx.stroke();
            }

            // 3. Wing (Flapping Animation)
            // Sine wave based on frames to calculate Y offset and Scale
            let flapSpeed = 0.3;
            let wingY = Math.sin(frames * flapSpeed) * 5; 
            
            ctx.fillStyle = '#fff'; // White wing
            ctx.beginPath();
            // Draw wing relative to body
            ctx.ellipse(-6, 4 + (wingY * 0.5), 10, 7, -0.2, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#e6e6e6';
            ctx.lineWidth = 1;
            ctx.stroke();

            // 4. Beak
            ctx.fillStyle = '#ff512f';
            ctx.beginPath();
            ctx.moveTo(12, 2);
            ctx.lineTo(26, 6); // Pointy end
            ctx.lineTo(12, 10);
            ctx.fill();
            // Beak shadow
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath();
            ctx.moveTo(12, 6);
            ctx.lineTo(22, 6);
            ctx.lineTo(12, 10);
            ctx.fill();

            ctx.restore();
        },
        update: function() {
            this.velocity += this.gravity;
            this.y += this.velocity;
            
            if(this.y + this.radius >= canvas.height - 30) gameOver();
            if(this.y - this.radius <= 0) {
                this.y = this.radius;
                this.velocity = 0;
            }
        },
        flap: function() {
            this.velocity = -this.jump;
        },
        reset: function() {
            this.y = canvas.height / 2;
            this.velocity = 0;
            this.rotation = 0;
        }
    };

    const pipes = {
        items: [],
        width: 70,
        gap: 170,
        dx: gameSpeed,

        draw: function() {
            for(let p of this.items) {
                // --- PIPE SHADING (Realistic Cylinder) ---
                let grad = ctx.createLinearGradient(p.x, 0, p.x + this.width, 0);
                grad.addColorStop(0, '#546e7a');    // Dark edge
                grad.addColorStop(0.3, '#cfd8dc');  // Specular Highlight (Shininess)
                grad.addColorStop(0.5, '#90a4ae');  // Mid
                grad.addColorStop(1, '#455a64');    // Dark edge
                
                ctx.fillStyle = grad;

                // Draw Top & Bottom
                ctx.fillRect(p.x, 0, this.width, p.top);
                ctx.fillRect(p.x, canvas.height - p.bottom, this.width, p.bottom);

                // Caps (With Hazard Stripes)
                this.drawCap(p.x, p.top - 24, this.width, 24);
                this.drawCap(p.x, canvas.height - p.bottom, this.width, 24);
                
                // Shadow cast by cap onto pipe
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(p.x, p.top, this.width, 10); // Shadow under top cap
            }
        },
        
        drawCap: function(x, y, w, h) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(x-4, y, w+8, h);
            ctx.clip();

            // Background
            ctx.fillStyle = '#37474f';
            ctx.fillRect(x-4, y, w+8, h);

            // Stripes
            ctx.fillStyle = '#f9a825'; // Bright industrial yellow
            ctx.beginPath();
            for(let i = -20; i < w+20; i+=15) {
                ctx.moveTo(x + i, y);
                ctx.lineTo(x + i + 8, y + h);
                ctx.lineTo(x + i + 16, y + h);
                ctx.lineTo(x + i + 8, y);
            }
            ctx.fill();

            // Bevel Highlight on Cap
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(x-4, y, w+8, 4);

            ctx.restore();
            
            // Outline
            ctx.strokeStyle = '#263238';
            ctx.lineWidth = 2;
            ctx.strokeRect(x-4, y, w+8, h);
        },

        update: function() {
            // Spawn logic
            if (frames % 100 === 0) {
                let min = 60;
                let avail = canvas.height - this.gap - (min*2);
                let topH = min + Math.random() * avail;
                let botH = canvas.height - this.gap - topH;
                
                this.items.push({ x: canvas.width, top: topH, bottom: botH, passed: false });
            }

            for(let i = 0; i < this.items.length; i++) {
                let p = this.items[i];
                p.x -= this.dx;

                // Collision Detection (Hitbox)
                let bLeft = bird.x - bird.radius + 5;
                let bRight = bird.x + bird.radius - 5;
                let bTop = bird.y - bird.radius + 5;
                let bBot = bird.y + bird.radius - 5;

                // Check pipe
                if (bRight > p.x && bLeft < p.x + this.width) {
                    if (bTop < p.top || bBot > canvas.height - p.bottom) {
                        gameOver();
                    }
                }

                if (p.x + this.width < bird.x && !p.passed) {
                    score++;
                    scoreEl.innerText = score;
                    // Bouncy Text Effect
                    scoreEl.style.transform = "scale(1.4)";
                    setTimeout(() => scoreEl.style.transform = "scale(1)", 150);
                    p.passed = true;
                }

                if (p.x + this.width < 0) {
                    this.items.shift();
                    i--;
                }
            }
        },
        reset: function() { this.items = []; }
    };

    // --- Core Logic ---

    function loop() {
        if (!isPlaying) return;

        // Draw Environment
        atmosphere.draw();
        atmosphere.drawSun();
        mountains.update();
        mountains.draw();
        clouds.forEach(c => { c.update(); c.draw(); });
        terrain.update();
        terrain.draw();

        pipes.update();
        pipes.draw();
        
        bird.update();
        bird.draw();

        frames++;
        if (!isGameOver) requestAnimationFrame(loop);
    }

    function startGame() {
        if(isPlaying && !isGameOver) return;
        
        bird.reset();
        pipes.reset();
        mountains.init();
        terrain.init();
        
        score = 0;
        frames = 0;
        scoreEl.innerText = "0";
        isGameOver = false;
        isPlaying = true;

        msgBox.classList.add('hidden');
        scoreEl.classList.remove('hidden');

        requestAnimationFrame(loop);
        bird.flap();
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        
        titleText.innerText = "OUCH!";
        subText.innerText = `Score: ${score}`;
        actionBtn.innerText = "TRY AGAIN";
        
        msgBox.classList.remove('hidden');
    }

    function handleInput(e) {
        if (e.type !== 'keydown') e.preventDefault();
        
        if (e.type === 'click' || e.type === 'touchstart' || e.code === 'Space' || e.code === 'ArrowUp') {
            if (isGameOver || !isPlaying) {
                startGame();
            } else {
                bird.flap();
            }
        }
    }

    window.addEventListener('keydown', handleInput);
    document.addEventListener('touchstart', handleInput, {passive: false});
    document.addEventListener('mousedown', handleInput);

    // Initial Static Draw
    function initDraw() {
        atmosphere.draw();
        atmosphere.drawSun();
        mountains.init();
        mountains.draw();
        clouds.forEach(c => c.draw());
        terrain.init();
        terrain.draw();
        bird.x = canvas.width/2;
        bird.y = canvas.height/2;
        bird.draw();
        bird.x = 80; 
    }
    
    actionBtn.addEventListener('click', (e) => {
        e.stopPropagation(); 
        startGame();
    });

    initDraw();

</script>
</body>
</html>
