<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Umang! 🎈</title>
  <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
  
  <!-- Premium Fonts: Luckiest Guy, Satisfy, and Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Satisfy&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* CSS Styles */
    * { box-sizing: border-box; }
    :root {
      --tongue: #c12115;
      --pupil: #fff;
      --icing: #f2f2f2;
      --stroke: #1a1a1a;
    }
    body {
      --frosting: hsl(var(--frosting-hue, 0), 100%, 55%);
      --lightness: 6; /* Starts cozy dark */
      --flame: 0;
      --glow-hue: 40;
      --glow-saturation: 50;
      --glow-lightness: 35;
      --glow-alpha: 0.4;
      --transparency-alpha: 0;
      --glow: hsla(var(--glow-hue), calc(var(--glow-saturation) * 1%), calc(var(--glow-lightness) * 1%), var(--glow-alpha));
      --transparent: hsla(0, 0%, 0%, var(--transparency-alpha));
      
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      /* Rich radial lighting gradient */
      background: radial-gradient(circle at center, hsl(340, 25%, calc(var(--lightness, 50) * 1%)) 0%, hsl(340, 15%, calc(var(--lightness, 50) * 0.7%)) 100%);
      transition: background 1.5s cubic-bezier(0.25, 1, 0.5, 1);
      font-family: 'Poppins', sans-serif;
    }

    /* Pull Chain / Light Thread */
    .pull-chain {
      position: absolute;
      top: 0;
      right: 15%;
      width: 30px;
      height: 220px;
      z-index: 100;
      cursor: grab;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: none; /* Prevents default page scroll when swiping down */
    }
    .pull-chain:active {
      cursor: grabbing;
    }
    .pull-string {
      width: 3px;
      height: 170px;
      background: linear-gradient(to bottom, #555, #d4af37 80%, #aa7c11 100%);
      box-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
    }
    .pull-knob {
      width: 22px;
      height: 22px;
      background: radial-gradient(circle, #ffe066 0%, #d4af37 60%, #aa7c11 100%);
      border-radius: 50%;
      border: 2.5px solid #4a3403;
      box-shadow: 0 3px 8px rgba(0,0,0,0.5), 0 0 10px rgba(212,175,55,0.8);
    }
    .pull-hint {
      position: absolute;
      top: 235px;
      right: calc(15% - 45px);
      color: #e5c158;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-align: center;
      width: 120px;
      pointer-events: none;
      opacity: 0.8;
      animation: gentle-glow 2s infinite alternate;
      z-index: 99;
    }
    @keyframes gentle-glow {
      0% { text-shadow: 0 0 5px rgba(212, 175, 55, 0.4); opacity: 0.6; }
      100% { text-shadow: 0 0 15px rgba(212, 175, 55, 0.9); opacity: 1; }
    }

    /* Core Content Container */
    .app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      max-width: 500px;
      opacity: 0;
      transform: translateY(40px);
      pointer-events: none;
      z-index: 10;
      gap: 15px;
    }

    /* Graffiti Styled Happy Birthday Title */
    .graffiti-title {
      font-family: 'Luckiest Guy', cursive;
      font-size: 2.8rem;
      text-align: center;
      margin: 10px 0 5px 0;
      line-height: 1.1;
      letter-spacing: 1px;
      background: linear-gradient(45deg, #ff007f, #ff5e00, #ffea00, #00ffcc, #7000ff, #ff007f);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient-shift 6s ease infinite;
      -webkit-text-stroke: 2px #121212;
      filter: drop-shadow(3px 3px 0px #121212) drop-shadow(0 10px 20px rgba(255, 0, 127, 0.35));
    }
    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Elegant Polaroid photo card (Middle Increased Size) */
    .birthday-card {
      background: #ffffff;
      padding: 18px 18px 24px 18px;
      border-radius: 14px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.04);
      transform: rotate(-1.5deg);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 1s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 300px; /* Increased slightly */
    }
    .birthday-card:hover {
      transform: rotate(0deg) scale(1.04);
    }
    /* Elegant soft bloom shadow that appears when lights turn on */
    body[style*="--lightness: 92"] .birthday-card {
      box-shadow: 0 35px 60px rgba(212, 175, 55, 0.15), 0 10px 25px rgba(0,0,0,0.08);
    }
    .photo-wrapper {
      width: 264px; /* Scaled up */
      height: 310px; /* Scaled up */
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid #f1f1f1;
    }
    .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-caption {
      font-family: 'Satisfy', cursive;
      font-size: 2.25rem; /* Scaled up */
      font-weight: 500;
      color: #1a1a1a;
      margin-top: 12px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* Isolated Container to Shift Cake Down and Prevent Overlap */
    .cake-container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 150px;
      width: 100%;
      position: relative;
      margin-top: 35px; /* Shifted cake down slightly */
      margin-bottom: 20px;
    }

    /* Cake / Birthday Button */
    .birthday-button { position: relative; transform: scale(0.6); cursor: pointer; }
    .birthday-button__text {
      position: absolute; top: 0; left: 0; height: 100%; width: 100%;
      display: flex; text-align: center; align-items: center; justify-content: center;
      font-size: 1.45rem; font-family: 'Poppins', sans-serif; font-weight: bold;
    }
    .birthday-button__text .char {
      display: inline-block;
      color: hsl(var(--hue, 0), calc(var(--char-sat, 0) * 1%), calc(var(--char-light, 0) * 1%));
    }
    .birthday-button:before {
      content: ''; position: absolute; height: 240px; width: 240px;
      background: radial-gradient(var(--glow), var(--transparent) 30%), radial-gradient(var(--glow), var(--transparent) 50%);
      border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -70%) scale(calc(var(--flame) * 3));
      z-index: 2; filter: blur(15px); opacity: var(--flame);
    }
    .birthday-button__button { width: 240px; height: 100px; position: relative; border: 0; background: var(--icing); border-radius: 14px; cursor: pointer; }
    .birthday-button__cake { position: absolute; bottom: 0; left: 50%; transform: translate(-50%, 0); width: 289.5px; display: none; }
    .cake__eye-body { fill: var(--stroke); }
    .cake__eye-pupil { fill: var(--pupil); }
    .cake__tongue { fill: var(--tongue); }
    .cake__mouth-opening { fill: var(--stroke); stroke: var(--stroke); }
    .cake__sprinkle { --sprinkle: hsl(var(--sprinkle-hue, 0), 100%, 75%); fill: var(--sprinkle); }
    .cake__frosting--start, .cake__frosting--duplicate { fill: var(--frosting); }
    .candle__flame { opacity: var(--flame, 0); }
    .candle__flame-outer { fill: #ff711f; }
    .candle__flame-inner { fill: #edca1d; }
    
    /* Toggle Sound Icon */
    label { height: 44px; width: 44px; position: fixed; bottom: 1rem; right: 1rem; cursor: pointer; z-index: 99; }
    label > svg { position: absolute; height: 100%; width: 100%; top: 0; left: 0; }
    label path { fill: #b28585; }
    label svg:nth-of-type(1) { display: none; }
    [type='checkbox'] { height: 0; width: 0; position: absolute; }
    :checked ~ label svg:nth-of-type(1) { display: block; }
    :checked ~ label svg:nth-of-type(2) { display: none; }
  </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
  const { gsap, gsap: { to, timeline, set, delayedCall }, Splitting } = window;
  Splitting();

  const BTN = document.querySelector('.birthday-button__button');
  const SOUNDS = {
    CHEER: new Audio('https://s3-us-west-2.amazonaws.com/s.cdpn.io/605876/cheer.mp3'),
    MATCH: new Audio('https://s3-us-west-2.amazonaws.com/s.cdpn.io/605876/match-strike-trimmed.mp3'),
    TUNE: new Audio('https://s3-us-west-2.amazonaws.com/s.cdpn.io/605876/happy-birthday-trimmed.mp3'),
    ON: new Audio('https://assets.codepen.io/605876/switch-on.mp3'),
    BLOW: new Audio('https://s3-us-west-2.amazonaws.com/s.cdpn.io/605876/blow-out.mp3'),
    POP: new Audio('https://s3-us-west-2.amazonaws.com/s.cdpn.io/605876/pop-trimmed.mp3'),
    HORN: new Audio('https://s3-us-west-2.amazonaws.com/s.cdpn.io/605876/horn.mp3')
  };

  Object.values(SOUNDS).forEach(s => s.muted = false);

  const EYES = document.querySelector('.cake__eyes');
  const BLINK = eyes => {
    gsap.set(eyes, { scaleY: 1 });
    if (eyes.BLINK_TL) eyes.BLINK_TL.kill();
    eyes.BLINK_TL = new gsap.timeline({
      delay: Math.floor(Math.random() * 4) + 1,
      onComplete: () => BLINK(eyes)
    });
    eyes.BLINK_TL.to(eyes, { duration: 0.05, transformOrigin: '50% 50%', scaleY: 0, yoyo: true, repeat: 1 });
  };
  BLINK(EYES);

  const FROSTING_TL = () => timeline()
    .to('#frosting', { scaleX: 1.015, duration: 0.25 }, 0)
    .to('#frosting', { scaleY: 1, duration: 1 }, 0)
    .to('#frosting', { duration: 1, morphSVG: '.cake__frosting--end' }, 0);

  const SPRINKLES_TL = () => timeline().to('.cake__sprinkle', { scale: 1, duration: 0.06, stagger: 0.02 });

  const SPIN_TL = () => timeline()
    .set('.cake__frosting-patch', { display: 'block' })
    .to(['.cake__frosting--duplicate', '.cake__sprinkles--duplicate'], { x: 0, duration: 1 }, 0)
    .to(['.cake__frosting--start', '.cake__sprinkles--initial'], { x: 65, duration: 1 }, 0)
    .to('.cake__face', { duration: 1, x: -48.82 }, 0);

  const FLICKER_TL = timeline().to('.candle__flame-outer', { duration: 0.1, repeat: -1, yoyo: true, morphSVG: '#flame-outer' })
    .to('.candle__flame-inner', { duration: 0.1, repeat: -1, yoyo: true, morphSVG: '#flame-inner' }, 0);

  const SHAKE_TL = () => timeline({ delay: 0.5 })
    .set('.cake__face', { display: 'none' }).set('.cake__face--straining', { display: 'block' })
    .to('.birthday-button', { onComplete: () => { set('.cake__face--straining', { display: 'none' }); set('.cake__face', { display: 'block' }); }, x: 1, y: 1, repeat: 13, duration: 0.1 }, 0)
    .to('.cake__candle', { onComplete: () => { FLICKER_TL.play(); }, onStart: () => { SOUNDS.POP.play(); delayedCall(0.2, () => SOUNDS.POP.play()); delayedCall(0.4, () => SOUNDS.POP.play()); }, ease: 'Elastic.easeOut', duration: 0.2, stagger: 0.2, scaleY: 1 }, 0.2);

  const FLAME_TL = () => timeline().to('.cake__candle', { '--flame': 1, stagger: 0.2, duration: 0.1 }).to('body', { '--flame': 1, '--lightness': 12, duration: 0.2, delay: 0.2 });
  const LIGHTS_OUT = () => timeline().to('body', { onStart: () => SOUNDS.BLOW.play(), delay: 0.5, '--lightness': 0, duration: 0.1, '--glow-saturation': 0, '--glow-lightness': 0, '--glow-alpha': 1, '--transparency-alpha': 1 });

  // Confetti setup
  const burstConfetti = () => {
    confetti({
      particleCount: 150,
      spread: 80,
      origin: { y: 0.6 }
    });
  };

  const runContinuousConfetti = () => {
    let duration = 6 * 1000;
    let end = Date.now() + duration;
    (function frame() {
      confetti({
        particleCount: 3,
        angle: 60,
        spread: 55,
        origin: { x: 0, y: 0.75 },
        colors: ['#ff007f', '#ffe066', '#d4af37', '#00ffcc', '#ffe5ec']
      });
      confetti({
        particleCount: 3,
        angle: 120,
        spread: 55,
        origin: { x: 1, y: 0.75 },
        colors: ['#ff007f', '#ffe066', '#d4af37', '#00ffcc', '#ffe5ec']
      });
      if (Date.now() < end) {
        requestAnimationFrame(frame);
      }
    }());
  };

  const RESET = () => {
    set('.char', { '--hue': () => Math.random() * 360, '--char-sat': 0, '--char-light': 0, x: 0, y: 0, opacity: 1 });
    set('body', { '--frosting-hue': Math.random() * 360, '--glow-saturation': 50, '--glow-lightness': 35, '--glow-alpha': 0.4, '--transparency-alpha': 0, '--flame': 0 });
    set('.cake__candle', { '--flame': 0 });
    set('.cake__frosting--end', { opacity: 0 });
    set('#frosting', { transformOrigin: '50% 10%', scaleX: 0, scaleY: 0 });
    set('.cake__frosting-patch', { display: 'none' });
    set(['.cake__frosting--duplicate', '.cake__sprinkles--duplicate'], { x: -65 });
    set('.cake__face', { x: -110 });
    set('.cake__face--straining', { display: 'none' });
    set('.cake__sprinkle', { '--sprinkle-hue': () => Math.random() * 360, scale: 0, transformOrigin: '50% 50%' });
    set('.birthday-button', { scale: 0.6, x: 0, y: 0 });
    set('.birthday-button__cake', { display: 'none' });
    set('.cake__candle', { scaleY: 0, transformOrigin: '50% 100%' });
  };
  RESET();

  const MASTER_TL = timeline({
    onStart: () => { SOUNDS.ON.play(); },
    onComplete: () => {
      // Gracefully reset back to the cozy original dark pull-chain screen so it can be replayed
      delayedCall(4, () => {
        gsap.to('body', { '--lightness': 6, duration: 1.5 });
        gsap.to('.pull-chain', { y: 0, opacity: 1, pointerEvents: 'auto', duration: 1, ease: 'back.out' });
        gsap.set('.pull-hint', { display: 'block' });
        gsap.to('.pull-hint', { y: 0, opacity: 1, duration: 1 });
        gsap.to('#appContainer', { opacity: 0, y: 40, duration: 1, pointerEvents: 'none' });
        RESET();
        pulled = false;
        BTN.removeAttribute('disabled');
      });
    },
    paused: true
  })
  .set('.birthday-button__cake', { display: 'block' })
  .to('.birthday-button', { onStart: () => { SOUNDS.CHEER.play(); burstConfetti(); }, scale: 1, duration: 0.2 })
  .to('.char', { '--char-sat': 70, '--char-light': 45, duration: 0.2 }, 0)
  .to('.char', { onStart: () => SOUNDS.HORN.play(), delay: 0.75, y: () => gsap.utils.random(-100, -200), x: () => gsap.utils.random(-50, 50), duration: () => gsap.utils.random(0.5, 1) })
  .to('.char', { opacity: 0, duration: 0.25 }, '>-0.5')
  .add(FROSTING_TL())
  .add(SPRINKLES_TL())
  .add(SPIN_TL())
  .add(SHAKE_TL())
  .add(FLAME_TL(), 'FLAME_ON')
  .add(LIGHTS_OUT(), 'LIGHTS_OUT');

  SOUNDS.TUNE.onended = SOUNDS.MATCH.onended = () => MASTER_TL.play();
  MASTER_TL.addPause('FLAME_ON', () => SOUNDS.MATCH.play());
  MASTER_TL.addPause('LIGHTS_OUT', () => {
    SOUNDS.TUNE.play();
    runContinuousConfetti();
  });

  // DRAG/SWIPE & TAP ENGINE FOR LIGHT THREAD
  let pulled = false;
  let isDragging = false;
  let startY = 0;
  let currentY = 0;
  const maxPullLimit = 80;

  const CHAIN = document.querySelector('.pull-chain');

  // Trigger main pull action
  const triggerPullAnimation = () => {
    if (pulled) return;
    pulled = true;

    // Direct physics snap down and release animation
    const tl = timeline();
    tl.to(CHAIN, { y: 40, duration: 0.12, ease: 'power1.in' })
      .to(CHAIN, { y: 0, duration: 0.45, ease: 'elastic.out(1, 0.3)' });

    delayedCall(0.15, () => {
      SOUNDS.ON.play();
      
      // Light up the screen
      gsap.to('body', { '--lightness': 92, duration: 1.5, ease: 'power2.out' });
      
      // Hide the hint text immediately so it is completely gone
      gsap.to('.pull-hint', { 
        opacity: 0, 
        y: -100, 
        duration: 0.6, 
        onComplete: () => {
          gsap.set('.pull-hint', { display: 'none' });
        }
      });
      
      // Slide up pull thread
      gsap.to(CHAIN, { opacity: 0, y: -120, pointerEvents: 'none', duration: 0.8, ease: 'power2.in' });
      
      // Animate App container elements into visual range
      gsap.to('#appContainer', { 
        opacity: 1, 
        y: 0, 
        duration: 1.2, 
        ease: 'back.out(1.1)', 
        pointerEvents: 'auto',
        onComplete: () => {
          MASTER_TL.restart();
        }
      });
    });
  };

  // Drag listeners utilizing Unified Pointer Events (touch/mouse/pen)
  CHAIN.addEventListener('pointerdown', (e) => {
    if (pulled) return;
    isDragging = true;
    startY = e.clientY;
    CHAIN.setPointerCapture(e.pointerId);
  });

  CHAIN.addEventListener('pointermove', (e) => {
    if (!isDragging || pulled) return;
    const deltaY = e.clientY - startY;
    if (deltaY > 0) {
      currentY = Math.min(deltaY, maxPullLimit);
      gsap.set(CHAIN, { y: currentY });
    }
  });

  CHAIN.addEventListener('pointerup', (e) => {
    if (!isDragging) return;
    isDragging = false;
    CHAIN.releasePointerCapture(e.pointerId);

    // If swiped/pulled down more than 35px, trigger turn on.
    if (currentY >= 35) {
      triggerPullAnimation();
    } else {
      // Elastic snapback
      gsap.to(CHAIN, { y: 0, duration: 0.3, ease: 'elastic.out(1, 0.4)' });
    }
    currentY = 0;
  });

  // Clicking/Tapping the thread triggers the animation as well
  CHAIN.addEventListener('click', () => {
    if (pulled) return;
    triggerPullAnimation();
  });

  // Audio mute controller setup
  const toggleAudio = () => {
    const shouldMute = SOUNDS.BLOW.muted;
    Object.values(SOUNDS).forEach(s => s.muted = !shouldMute);
  };
  document.querySelector('#volume').addEventListener('input', toggleAudio);
</script>

</body>
</html>
