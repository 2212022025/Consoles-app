<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utkarsh AI - Voice Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { margin-top: 0; color: #38bdf8; }
        .status {
            margin: 20px 0;
            font-size: 1.1rem;
            color: #94a3b8;
        }
        .pulse-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #0284c7;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.7);
        }
        .pulse-btn.listening {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .chat-box {
            margin-top: 20px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .user-text { color: #38bdf8; margin-bottom: 8px; }
        .ai-text { color: #4ade80; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Utkarsh AI</h1>
    <p>Voice Activated Assistant</p>
    
    <button id="micBtn" class="pulse-btn">🎙️</button>
    <div id="status" class="status">Click or speak to start...</div>

    <div id="chatBox" class="chat-box"></div>
</div>

<script>
    const API_KEY = "AIzaSyAOe54iqR6N9_2_G_y3T6ox-XlzPXP7kA0";
    const SYSTEM_INSTRUCTION = "Your name is Utkarsh AI. If anyone asks 'Who created you' or about your creator, respond clearly: 'Utkarsh from Varanasi, India created me.' Be concise and natural in spoken responses.";

    const micBtn = document.getElementById('micBtn');
    const statusDiv = document.getElementById('status');
    const chatBox = document.getElementById('chatBox');

    // Speech Recognition Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('listening');
            statusDiv.textContent = "Listening...";
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('listening');
            statusDiv.textContent = "Processing...";
        };

        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript;
            appendMessage("You", transcript, "user-text");
            await getGeminiResponse(transcript);
        };

        recognition.onerror = (event) => {
            statusDiv.textContent = "Error: " + event.error;
            micBtn.classList.remove('listening');
        };
    } else {
        statusDiv.textContent = "Web Speech API is not supported in this browser.";
    }

    // Auto-request microphone permission on page load
    window.addEventListener('DOMContentLoaded', () => {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(() => {
                statusDiv.textContent = "Microphone ready. Tap the mic to talk!";
            })
            .catch((err) => {
                statusDiv.textContent = "Microphone access denied: " + err.message;
            });
    });

    micBtn.addEventListener('click', () => {
        if (!recognition) return;
        if (isListening) {
            recognition.stop();
        } else {
            window.speechSynthesis.cancel(); // Stop any active speech
            recognition.start();
        }
    });

    async function getGeminiResponse(userPrompt) {
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    system_instruction: {
                        parts: [{ text: SYSTEM_INSTRUCTION }]
                    },
                    contents: [{
                        parts: [{ text: userPrompt }]
                    }]
                })
            });

            const data = await response.json();
            const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I couldn't process that.";

            appendMessage("Utkarsh AI", aiText, "ai-text");
            speakText(aiText);
            statusDiv.textContent = "Listening complete. Tap mic to talk again.";
        } catch (error) {
            console.error(error);
            statusDiv.textContent = "Error connecting to Gemini API.";
        }
    }

    function speakText(text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
    }

    function appendMessage(sender, text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = className;
        msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
