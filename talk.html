<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utkarsh AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .mic-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        .mic-btn.active { background: #dc2626; }
        .status { margin-top: 15px; font-size: 0.9rem; color: #a1a1aa; }
        .chat-box {
            margin-top: 20px;
            background: #000;
            padding: 10px;
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Utkarsh AI</h2>
    <p>Click below to grant microphone permission & talk.</p>
    
    <button id="startBtn" class="mic-btn">Grant Permission / Talk</button>
    <div id="status" class="status">Waiting for interaction...</div>

    <div id="chatBox" class="chat-box"></div>
</div>

<script>
    const API_KEY = "AIzaSyAOe54iqR6N9_2_G_y3T6ox-XlzPXP7kA0";
    const SYSTEM_INSTRUCTION = "Your name is Utkarsh AI. If anyone asks 'Who created you' or about your creator, respond clearly: 'Utkarsh from Varanasi, India created me.' Be concise and natural in spoken responses.";

    const startBtn = document.getElementById('startBtn');
    const statusDiv = document.getElementById('status');
    const chatBox = document.getElementById('chatBox');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let hasPermission = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            startBtn.classList.add('active');
            startBtn.textContent = "Listening...";
            statusDiv.textContent = "Listening to your voice...";
        };

        recognition.onend = () => {
            startBtn.classList.remove('active');
            startBtn.textContent = "Talk to Utkarsh AI";
        };

        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript;
            appendMessage("You", transcript);
            statusDiv.textContent = "Thinking...";
            await queryGemini(transcript);
        };

        recognition.onerror = (event) => {
            if (event.error === 'not-allowed') {
                statusDiv.textContent = "Microphone access blocked. Enable it in address bar settings.";
            } else {
                statusDiv.textContent = "Error: " + event.error;
            }
            startBtn.classList.remove('active');
            startBtn.textContent = "Try Again";
        };
    } else {
        statusDiv.textContent = "Speech recognition is not supported in this browser.";
    }

    startBtn.addEventListener('click', async () => {
        if (!hasPermission) {
            try {
                // User gesture explicitly triggers permission prompt
                await navigator.mediaDevices.getUserMedia({ audio: true });
                hasPermission = true;
                statusDiv.textContent = "Microphone allowed! Starting recognition...";
                recognition.start();
            } catch (err) {
                statusDiv.textContent = "Permission denied or blocked. Allow mic access in browser settings.";
            }
        } else {
            window.speechSynthesis.cancel();
            recognition.start();
        }
    });

    async function queryGemini(userPrompt) {
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    system_instruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
                    contents: [{ parts: [{ text: userPrompt }] }]
                })
            });

            const data = await response.json();
            const aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I could not respond.";

            appendMessage("Utkarsh AI", aiReply);
            speak(aiReply);
            statusDiv.textContent = "Done. Tap button to speak again.";
        } catch (err) {
            statusDiv.textContent = "API Error. Check internet connection.";
        }
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(utterance);
    }

    function appendMessage(sender, text) {
        const msg = document.createElement('div');
        msg.innerHTML = `<strong>${sender}:</strong> ${text}`;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
