<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Reward Portal</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Expired State */
        #expired-screen { display: none; text-align: center; }
        #expired-screen h1 { color: #ef4444; font-size: 2.5rem; margin-bottom: 10px; }

        /* Loader States */
        .loader-container { text-align: center; }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .dots span {
            font-size: 4rem;
            line-height: 0;
            animation: blink 1.4s infinite both;
            color: var(--primary);
        }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        /* Main Content */
        #main-content {
            display: none;
            width: 90%;
            max-width: 400px;
            background: var(--card);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        .reward-img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
        }

        .btn-group { display: flex; flex-direction: column; gap: 12px; }

        .btn {
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            font-size: 0.95rem;
            display: block;
        }

        .btn:active { transform: scale(0.97); }
        .btn-blue { background: var(--primary); color: white; }
        .btn-green { background: #10b981; color: white; }
        .btn-outline { background: #334155; color: white; }

        .code-box {
            margin-top: 15px;
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            display: none;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #475569;
        }

        #copy-btn {
            background: #334155;
            border: none;
            color: #818cf8;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            transition: opacity 0.1s;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="expired-screen">
        <h1>Site Expired</h1>
        <p>This link is no longer active.</p>
    </div>

    <div id="verifying-screen" class="loader-container">
        <div class="spinner"></div>
        <h2 style="font-weight: 500;">Verifying</h2>
    </div>

    <div id="payment-screen" class="loader-container" style="display: none;">
        <h2 style="font-weight: 500; margin-bottom: 30px;">Processing Payment</h2>
        <div class="dots">
            <span>.</span><span>.</span><span>.</span>
        </div>
    </div>

    <div id="main-content">
        <img src="https://files.catbox.moe/sh2p7y.jpg" alt="Reward" class="reward-img">
        
        <div class="btn-group">
            <button class="btn btn-blue" onclick="downloadImg()">Download Rewards</button>
            <a href="https://play.google.com/redeem?code=503WNUK61J4ALBW9" target="_blank" class="btn btn-green">Claim Rewards</a>
            <button class="btn btn-outline" onclick="toggleCode()">Show Redeem Codes</button>
        </div>

        <div id="code-container" class="code-box">
            <code id="code-text" style="color: #60a5fa; font-family: monospace; font-size: 1.1rem;">503WNUK61J4ALBW9</code>
            <button id="copy-btn" onclick="copyToClipboard()">COPY</button>
        </div>
    </div>

    <script>
        const CODE = "503WNUK61J4ALBW9";
        const IMG = "https://files.catbox.moe/sh2p7y.jpg";

        function init() {
            const now = new Date();
            // Set for April 12, 2026
            const expiry = new Date(2026, 3, 12); 

            if (now >= expiry) {
                document.getElementById('verifying-screen').style.display = 'none';
                document.getElementById('expired-screen').style.display = 'block';
                return;
            }

            // Step 1: Verify (3s)
            setTimeout(() => {
                document.getElementById('verifying-screen').style.display = 'none';
                document.getElementById('payment-screen').style.display = 'block';

                // Step 2: Payment (5s)
                setTimeout(() => {
                    document.getElementById('payment-screen').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                }, 5000);

            }, 3000);
        }

        function downloadImg() {
            const link = document.createElement('a');
            link.href = IMG;
            link.download = 'Reward_Image.jpg';
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function toggleCode() {
            const box = document.getElementById('code-container');
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        }

        function copyToClipboard() {
            const btn = document.getElementById('copy-btn');
            
            // Standard Copy Logic
            const el = document.createElement('textarea');
            el.value = CODE;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            // Visual feedback only (No text/alert)
            btn.style.opacity = '0.3';
            setTimeout(() => { btn.style.opacity = '1'; }, 150);
        }

        window.onload = init;
    </script>
</body>
</html>
